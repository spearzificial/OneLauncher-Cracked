name: Release Multiplatform Binaries

on:
  push:
    tags:
      - 'v*-c*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v2.10.1-c2)'
        required: true
        type: string

concurrency:
  group: cracked-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  SQLX_OFFLINE: 'true'
  SQLX_OFFLINE_DIR: packages/oneclient_db/.sqlx
  # Same profile overrides as the nightly workflow: thin LTO links in a fraction of
  # the time and the shipped binary is functionally identical.
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            os_key: macos
            arch: arm64
            formats: app,dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            os_key: macos
            arch: x64
            formats: app,dmg
            macos_deployment_target: '10.14'
          - platform: ubuntu-22.04
            target: ''
            os_key: linux
            arch: x86_64
            formats: deb,appimage
          - platform: windows-latest
            target: ''
            os_key: windows
            arch: x64
            formats: nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n -E '/^\[workspace\.package\]/,/^\[/ s/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n1)"
          echo "Cargo.toml version: $version, tag: $TAG"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match workspace version $version"
            exit 1
          fi

      - name: (macOS) Pin deployment target
        if: matrix.macos_deployment_target != ''
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}
          save-cache: true
          restore-cache: true
          cache-namespace: nightly-cache

      - name: (Linux) Install system dependencies
        if: matrix.os_key == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang lld python3 \
            libfontconfig-dev libfreetype-dev \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libdbus-1-dev \
            libfuse2

      - name: Install cargo-packager
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-packager
          version: 0.11.8

      - name: Build release binary
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --bin oneclient_app --target ${{ matrix.target }}
          else
            cargo build --release --bin oneclient_app
          fi

      - name: (macOS) Compile app icon catalog
        if: matrix.os_key == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          out="packages/oneclient_app/icons/generated"
          mkdir -p "$out"
          xcrun actool packages/oneclient_app/icons/OneClient.icon \
            --compile "$out" \
            --app-icon OneClient \
            --output-partial-info-plist "$out/partial.plist" \
            --platform macosx \
            --minimum-deployment-target 26.0 \
            --errors --warnings --notices
          rm -f "$out/OneClient.icns"
          test -f "$out/Assets.car" || { echo "::error::actool produced no Assets.car"; exit 1; }

      - name: (Windows) Stage app-local VC++ runtime
        if: matrix.os_key == 'windows'
        shell: bash
        run: python3 distribution/windows/bundle-crt.py

      - name: Package
        shell: bash
        env:
          CI: 'true'
        run: |
          ARGS="--release --formats ${{ matrix.formats }}"
          if [ -n "${{ matrix.target }}" ]; then
            ARGS="$ARGS --target ${{ matrix.target }}"
          fi
          cargo packager $ARGS --verbose

      - name: Resolve packager output dir
        id: outdir
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            echo "dir=target/${{ matrix.target }}/release" >> "$GITHUB_OUTPUT"
          else
            echo "dir=target/release" >> "$GITHUB_OUTPUT"
          fi

      - name: (Linux) Install cargo-generate-rpm
        if: matrix.os_key == 'linux'
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-generate-rpm
          version: 0.21.0

      - name: (Linux) Build RPM
        if: matrix.os_key == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cp target/release/.cargo-packager/deb/*/data/usr/share/applications/oneclient_app.desktop \
             target/release/oneclient_app.desktop
          cargo generate-rpm -p packages/oneclient_app
          cp target/generate-rpm/*.rpm "${{ steps.outdir.outputs.dir }}/"

      - name: Collect release assets
        shell: bash
        env:
          OUT_DIR: ${{ steps.outdir.outputs.dir }}
          OS_KEY: ${{ matrix.os_key }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          v="${TAG#v}"
          mkdir -p dist
          pick() { # pick <glob> <dest name>, exactly one match required
            local files=($1)
            if [ "${#files[@]}" -ne 1 ]; then
              echo "::error::expected exactly one file for '$1', found ${#files[@]}"
              ls -la "$OUT_DIR"
              exit 1
            fi
            cp "${files[0]}" "dist/$2"
          }
          case "$OS_KEY" in
            linux)
              pick "$OUT_DIR/*.deb" "oneclient_app_${v}_amd64.deb"
              pick "$OUT_DIR/*.AppImage" "oneclient_app-${v}_x86_64.AppImage"
              pick "$OUT_DIR/*.rpm" "oneclient_app-${v}-1.x86_64.rpm"
              tar -czf "dist/OneLauncher-Cracked-${TAG}-linux-x86_64.tar.gz" -C "$OUT_DIR" oneclient_app
              ;;
            windows)
              pick "$OUT_DIR/*-setup.exe" "oneclient_app_${v}_x64-setup.exe"
              mkdir -p stage
              cp "$OUT_DIR/oneclient_app.exe" stage/
              cp target/crt/*.dll stage/
              (cd stage && 7z a -tzip "../dist/OneLauncher-Cracked-${TAG}-windows-x64.zip" ./* > /dev/null)
              ;;
            macos)
              pick "$OUT_DIR/*.dmg" "OneLauncher-Cracked-${TAG}-macos-${ARCH}.dmg"
              apps=("$OUT_DIR"/*.app)
              [ "${#apps[@]}" -eq 1 ] || { echo "::error::expected one .app bundle"; ls -la "$OUT_DIR"; exit 1; }
              ditto -c -k --sequesterRsrc --keepParent "${apps[0]}" "dist/OneLauncher-Cracked-${TAG}-macos-${ARCH}.zip"
              ;;
          esac
          ls -la dist

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.os_key }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORGEJO_URL: https://git.oiupoyt.space
      FORGEJO_REPO: oiupoyt/OneLauncher-Cracked
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          pattern: release-*
          merge-multiple: true

      - name: Verify the full asset set is present
        shell: bash
        run: |
          set -euo pipefail
          v="${TAG#v}"
          expected=(
            "oneclient_app_${v}_x64-setup.exe"
            "oneclient_app-${v}_x86_64.AppImage"
            "oneclient_app_${v}_amd64.deb"
            "oneclient_app-${v}-1.x86_64.rpm"
            "OneLauncher-Cracked-${TAG}-macos-arm64.dmg"
            "OneLauncher-Cracked-${TAG}-macos-x64.dmg"
            "OneLauncher-Cracked-${TAG}-windows-x64.zip"
            "OneLauncher-Cracked-${TAG}-linux-x86_64.tar.gz"
            "OneLauncher-Cracked-${TAG}-macos-arm64.zip"
            "OneLauncher-Cracked-${TAG}-macos-x64.zip"
          )
          ls -la assets
          for f in "${expected[@]}"; do
            [ -s "assets/$f" ] || { echo "::error::missing release asset: $f"; exit 1; }
          done

      - name: Render release notes
        shell: bash
        run: python3 .github/scripts/release_notes.py "$TAG" > notes.md

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" assets/* \
            --verify-tag \
            --title "OneLauncher-Cracked $TAG" \
            --notes-file notes.md \
            --latest

      - name: Copy release to Forgejo
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FORGEJO_TOKEN:-}" ]; then
            echo "::error::FORGEJO_TOKEN secret is not set; the GitHub release is published but the Forgejo copy was not made."
            exit 1
          fi
          api="$FORGEJO_URL/api/v1/repos/$FORGEJO_REPO"
          auth="Authorization: token $FORGEJO_TOKEN"

          existing="$(curl -fsS -H "$auth" "$api/releases/tags/$TAG" -o /dev/null -w '%{http_code}' || true)"
          if [ "$existing" = "200" ]; then
            id="$(curl -fsS -H "$auth" "$api/releases/tags/$TAG" | jq -r .id)"
            curl -fsS -X DELETE -H "$auth" "$api/releases/$id"
          fi

          sed "s#https://github.com/oiupoyt/OneLauncher-Cracked/releases/download/#$FORGEJO_URL/$FORGEJO_REPO/releases/download/#g" notes.md > notes-forgejo.md
          release="$(jq -n --arg tag "$TAG" --arg name "OneLauncher-Cracked $TAG" --rawfile body notes-forgejo.md \
            '{tag_name:$tag, target_commitish:"main", name:$name, body:$body, draft:false, prerelease:false}' \
            | curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' -d @- "$api/releases")"
          rid="$(echo "$release" | jq -r .id)"
          for f in assets/*; do
            echo "uploading $(basename "$f")"
            curl -fsS --retry 3 -X POST -H "$auth" \
              -F "attachment=@$f" \
              "$api/releases/$rid/assets?name=$(basename "$f")" > /dev/null
          done
          echo "Forgejo release: $FORGEJO_URL/$FORGEJO_REPO/releases/tag/$TAG"
