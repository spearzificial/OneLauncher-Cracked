[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.aarch64-apple-darwin]
linker = "aarch64-apple-darwin-clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "link-arg=-isysroot",
    "-C", "link-arg=/home/oiupoyt/.local/share/MacOSX11.3.sdk",
]

[target.x86_64-apple-darwin]
linker = "x86_64-apple-darwin-clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "link-arg=-isysroot",
    "-C", "link-arg=/home/oiupoyt/.local/share/MacOSX11.3.sdk",
]

# Linux and Macos by default have 8MB of stack storage.
# Windows has 1MB, it isn't enough, so it's changed to 8MB also.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]
